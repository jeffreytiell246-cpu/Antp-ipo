services:
  - type: web
    name: antropic-ipo-site
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
